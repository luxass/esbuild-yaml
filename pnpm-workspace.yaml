ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

catalogs:
  runtime:
    yaml: 2.9.1

  dev:
    esbuild: 0.28.0
    oxfmt: 0.67.0
    oxlint: 1.82.0
    oxlint-tsgolint: 7.0.2001
    publint: 0.3.24
    tsdown: 0.23.0
    typescript: 7.0.2

  testing:
    vitest: 5.0.0

  types:
    "@types/node": 24.13.4

onlyBuiltDependencies:
  - esbuild
