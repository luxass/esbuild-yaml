ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

catalogs:
  runtime:
    yaml: 2.9.1

  dev:
    esbuild: 0.28.2
    oxfmt: 0.75.0
    oxlint: 1.90.0
    oxlint-tsgolint: 7.0.2005
    publint: 0.3.25
    tsdown: 0.23.4
    typescript: 7.0.2

  testing:
    vitest: 5.1.0

  types:
    "@types/node": 26.6.6

onlyBuiltDependencies:
  - esbuild
